name: El Heraldo - private source checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: el-heraldo-private-checks
  cancel-in-progress: true

jobs:
  private-tests:
    name: Run tests against private Pruebas branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private source (Pruebas only)
        uses: actions/checkout@v5
        with:
          repository: ElCreador5/el-heraldo-bot
          ref: Pruebas
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        working-directory: private-source
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt -r requirements-backup.txt
          python -m pip check

      - name: Compile condemnation modules and run focused regression tests
        working-directory: private-source
        shell: bash
        run: |
          set +e
          python -m py_compile \
            bot.py \
            condemnation_repository.py \
            condemnation_role_restore.py \
            condemnation_release.py \
            tests/test_condemnation_repository.py \
            tests/test_condemnation_role_restore.py \
            tests/test_condemnation_pardon_runtime.py \
            tests/test_condemnation_release_service.py \
            tests/test_condemnation_case_card.py \
            tests/test_condemnation_log_dedup.py \
            tests/test_condemnation_private_threads.py \
            tests/test_condemn_default_reason_test_only.py \
            > "$RUNNER_TEMP/private-check.log" 2>&1
          compile_status=$?

          if [ "$compile_status" -eq 0 ]; then
            PYTHONPATH="tests:." python -m unittest \
              test_condemnation_repository \
              test_condemnation_role_restore \
              test_condemnation_pardon_runtime \
              test_condemnation_release_service \
              test_condemnation_case_card \
              test_condemnation_log_dedup \
              test_condemnation_private_threads \
              test_condemn_default_reason_test_only \
              >> "$RUNNER_TEMP/private-check.log" 2>&1
            test_status=$?
          else
            test_status=99
          fi

          if [ "$compile_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "::error::Private-source checks failed. Printing only sanitized test identifiers."
            if [ "$compile_status" -ne 0 ]; then
              echo "Compilation failed in configured source/test files."
            elif [ "$test_status" -ne 0 ]; then
              python - "$RUNNER_TEMP/private-check.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(errors="replace")
          blocks = re.split(r"(?=^(?:FAIL|ERROR): )", output, flags=re.MULTILINE)
          reported = set()
          for block in blocks:
              match = re.search(r"^(?:FAIL|ERROR): ([A-Za-z_][A-Za-z0-9_.]*)", block, re.MULTILINE)
              if not match:
                  continue
              name = match.group(1)
              if name in reported:
                  continue
              reported.add(name)
              frame = re.search(r'File "([^"]+/(?:tests/)?[A-Za-z0-9_]+\\.py)", line (\\d+)', block)
              kind = "AssertionError" if "AssertionError" in block else "Exception"
              location = f"{Path(frame.group(1)).name}:{frame.group(2)}" if frame else "location unavailable"
              print(f"- {name} [{location}; {kind}]")
          if not reported:
              print("Regression test command failed; no test identifiers were available.")
          PY
            fi
            exit 1
          fi

          echo "Private-source compile and condemnation regression tests passed."
